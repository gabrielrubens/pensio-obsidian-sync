name: Release Obsidian plugin

# Two ways in:
#   - pushing a tag (the usual path) makes a DRAFT release for that tag;
#   - running it by hand with a version makes the tag AND publishes the
#     release, from the head of main. That path exists for a session whose
#     network refuses tag pushes; it refuses a version the manifest does not
#     declare, so it can never tag the wrong commit.
#
# ⭐ A version with a hyphen (0.6.0-beta.1) is a PRE-RELEASE, for BRAT. Run it
# by hand on a branch whose manifest.json declares that version, never on main:
# the community directory offers whatever version main's manifest.json names,
# so a beta that reached main would update every installed plugin. A
# pre-release is never "Latest", and BRAT can install it by its tag.
#
# ⭐ The release notes are that version's section of CHANGELOG.md (a beta
# without its own section uses its base version's). A release with no section
# is refused, not published blank: the Community plugin review reports a
# release with no description.
#
# ⭐ main.js, manifest.json and styles.css carry a build provenance attestation
# (actions/attest), so anyone can check a downloaded file was built here, from
# this commit:  gh attestation verify main.js --repo gabrielrubens/pensio-obsidian-sync

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal manifest.json's version, e.g. 0.5.1)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # actions/attest: mint the OIDC token for the signing certificate, and
      # store the attestation.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Refuse a version the manifest does not declare
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          declared="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "$declared" ]; then
            echo "::error::asked for $VERSION but manifest.json declares $declared"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          section() {
            awk -v v="$1" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md
          }
          section "$VERSION" > release-notes.md
          if [ ! -s release-notes.md ] && [ "${VERSION%%-*}" != "$VERSION" ]; then
            section "${VERSION%%-*}" > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION (a heading '## $VERSION')"
            exit 1
          fi
          cat release-notes.md

      # npm ci, never npm install: the build must use the lockfile exactly, or
      # the review's byte-for-byte rebuild of main.js stops matching.
      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$VERSION" \
              --title="$VERSION" \
              --notes-file=release-notes.md \
              --target="$GITHUB_SHA" \
              $prerelease \
              main.js manifest.json styles.css
          else
            tag="${GITHUB_REF#refs/tags/}"

            gh release create "$tag" \
              --title="$tag" \
              --notes-file=release-notes.md \
              --draft \
              main.js manifest.json styles.css
          fi
